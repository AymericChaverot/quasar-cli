[package]
name = "quasar-cli"
# Releases take their version from the git tag (QSR_VERSION, see release.yml).
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line client for the Quasar self-hosted platform"
license = "MIT"
repository = "https://github.com/AymericChaverot/quasar-cli"
readme = "README.md"
publish = false

[[bin]]
name = "qsr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
flate2 = "1.1.11"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.2.1"

[profile.release]
codegen-units = 1
lto = true
strip = true

[target."cfg(windows)".dependencies]
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
