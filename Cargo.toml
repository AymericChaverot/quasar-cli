[package]
name = "quasar-cli"
# Releases take their version from the git tag (QSR_VERSION, see release.yml).
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line client for the Quasar self-hosted platform"
license = "MIT"
repository = "https://github.com/AymericChaverot/quasar-cli"
readme = "README.md"
publish = false

[[bin]]
name = "qsr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
